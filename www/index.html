<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stroke Painter</title>
<style>
  :root {
    --bg: #fafaf8; --ink: #1c1b19; --muted: #77726a; --faint: #b3ada3;
    --line: #e9e6df; --panel: #ffffff; --accent: #2f6b5a; --accent-soft: #e7f0ec; --accent-ink: #ffffff;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161614; --ink: #ecebe6; --muted: #9b968c; --faint: #5d5951;
      --line: #2c2b28; --panel: #1e1d1b; --accent: #8cc7b1; --accent-soft: #223029; --accent-ink: #0f1d18;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 1080px; margin: 0 auto; padding-block: 24px 40px; padding-inline: 20px; display: grid; gap: 20px; }

  /* Top bar */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .title { font-size: 15px; font-weight: 650; letter-spacing: -0.01em; }
  .hint { color: var(--muted); font-size: 13px; }

  /* Stage */
  .stage { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 20px; align-items: start; }
  @media (max-width: 720px) { .stage { grid-template-columns: 1fr; } }
  .pane-label { font-size: 12px; color: var(--muted); margin-bottom: 8px; display: flex; justify-content: space-between; }
  .box { position: relative; width: 100%; border-radius: 10px; overflow: hidden; background: var(--panel);
         border: 1px solid var(--line); display: grid; place-items: center; }
  .box canvas { display: block; width: 100%; height: 100%; }
  #drop { cursor: pointer; aspect-ratio: 1 / 1; }
  #drop.drag { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  #drop input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
  .prompt { text-align: center; padding: 20px; color: var(--muted); pointer-events: none; }
  .prompt b { display: block; color: var(--ink); font-weight: 600; margin-bottom: 4px; }
  .prompt small { color: var(--faint); font-size: 12px; }
  #srcBox { display: none; }
  #drop.has-img .prompt { display: none; }
  #drop.has-img #srcBox { display: block; }
  #paperBox { aspect-ratio: 1 / 1; background: #fff; border-color: var(--line); }
  #paperBox .prompt { color: #9a958b; }
  .paper-hint { position: absolute; inset: 0; display: grid; place-items: center; }
  #paperBox.has-art .paper-hint { display: none; }
  #paperBox canvas { object-fit: contain; }

  /* Controls */
  .dock { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px;
          display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); align-items: end; }
  .ctl label.row { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .ctl b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--accent); margin: 4px 0 0; }
  .switches { display: grid; gap: 10px; }
  .switch { display: flex; align-items: center; gap: 10px; font-size: 13px; cursor: pointer; user-select: none; }
  .switch input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }

  .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button { font: inherit; font-size: 13px; font-weight: 550; padding: 9px 16px; border-radius: 9px; cursor: pointer;
           border: 1px solid var(--line); background: var(--panel); color: var(--ink); transition: border-color .15s, opacity .15s; }
  button:hover:not(:disabled) { border-color: var(--faint); }
  button:disabled { opacity: .4; cursor: default; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; padding-inline: 22px; }
  .spacer { flex: 1; }

  /* Progress */
  .progress { display: grid; gap: 10px; }
  .status-row { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
  .status-row span:first-child { color: var(--ink); }
  .bar { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .15s linear; }
  .rounds { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { font-size: 11px; padding: 3px 9px; border-radius: 999px; color: var(--faint); border: 1px solid var(--line); }
  .chip.done { color: var(--accent); border-color: var(--accent-soft); background: var(--accent-soft); }
  .chip.now { color: var(--accent-ink); background: var(--accent); border-color: transparent; }
</style>
</head>
<body>
<main class="wrap">
  <header class="top">
    <div>
      <div class="title">Stroke Painter</div>
    </div>
    <div class="hint">Drop, click, or paste (Cmd/Ctrl+V) an image</div>
  </header>

  <section class="stage">
    <div>
      <div class="pane-label"><span>Original</span><span id="srcInfo"></span></div>
      <label class="box" id="drop">
        <div class="prompt" id="prompt">
          <b>Choose an image</b>
          <small>Any size. Keeps its proportions.</small>
        </div>
        <div id="srcBox" style="width:100%"></div>
        <input type="file" id="file" accept="image/*" aria-label="Choose an image">
      </label>
    </div>
    <div>
      <div class="pane-label"><span>Painting</span><span id="outInfo"></span></div>
      <div class="box" id="paperBox">
        <canvas id="out" width="256" height="256"></canvas>
        <div class="prompt paper-hint">
          <div><b>Your painting</b><small>Appears here when you press Paint</small></div>
        </div>
      </div>
    </div>
  </section>

  <section class="dock" aria-label="Settings">
    <div class="ctl">
      <label class="row" for="rounds">Rounds <b id="roundsVal">5</b></label>
      <input type="range" id="rounds" min="1" max="12" value="5">
    </div>
    <div class="ctl">
      <label class="row" for="detail">Detail <b id="detailVal">Balanced</b></label>
      <input type="range" id="detail" min="1" max="5" value="3">
    </div>
    <div class="ctl">
      <label class="row" for="speed">Speed <b id="speedVal">Normal</b></label>
      <input type="range" id="speed" min="0" max="100" value="50">
    </div>
    <div class="switches">
      <label class="switch"><input type="checkbox" id="pauseEach" checked> Pause after each round</label>
      <label class="switch"><input type="checkbox" id="recordVideo"> Record video (saved only if you download it)</label>
    </div>
  </section>

  <section class="actions">
    <button class="primary" id="paint" disabled>Paint</button>
    <button id="toggle" disabled>Pause</button>
    <button id="next" hidden>Next round</button>
    <span class="spacer"></span>
    <button id="dlPng" disabled>Download PNG</button>
    <button id="dlVideo" disabled>Download video</button>
  </section>

  <section class="progress" aria-live="polite">
    <div class="status-row"><span id="status">Choose an image to begin.</span><span id="count"></span></div>
    <div class="bar"><i id="bar"></i></div>
    <div class="rounds" id="chips"></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const out = $('out').getContext('2d');
const srcCanvas = document.createElement('canvas');
const srcCtx = srcCanvas.getContext('2d', { willReadFrequently: true });
const DETAIL_NAMES = ['Sketch', 'Light', 'Balanced', 'Detailed', 'Fine'];

let img = null;            // loaded source image
let srcW = 0, srcH = 0;    // working size of the source (keeps the image's aspect ratio)
let outW = 0, outH = 0;    // painting size
let strokes = [], roundEnd = [], rounds = 0;
let drawn = 0, pos = 0, curRound = 0;
let playing = false, waiting = false, lastT = 0, raf = 0;
let rec = null, recChunks = [], videoBlob = null, videoExt = 'webm';

// Longest side of the working image, from the Detail slider.
function longSide(d) { return 256 + 64 * (d - 1); }        // 256 .. 512 px
function speedRate(v) { return 10 * Math.pow(200, v / 100); } // 10 .. 2000 strokes/s
function speedName(v) { const r = speedRate(v); return r < 60 ? 'Slow' : r < 300 ? 'Normal' : r < 1000 ? 'Fast' : 'Very fast'; }
function sizeFor(iw, ih, L) {
  return iw >= ih ? [L, Math.max(1, Math.round(L * ih / iw))] : [Math.max(1, Math.round(L * iw / ih)), L];
}

// ---- source image -----------------------------------------------------
function renderSource() {
  if (!img) return;
  [srcW, srcH] = sizeFor(img.width, img.height, longSide(+$('detail').value));
  srcCanvas.width = srcW; srcCanvas.height = srcH;
  srcCtx.fillStyle = '#fff';
  srcCtx.fillRect(0, 0, srcW, srcH);
  srcCtx.drawImage(img, 0, 0, srcW, srcH);
  $('srcBox').replaceChildren(srcCanvas);
  srcCanvas.style.cssText = 'width:100%;height:auto;display:block;';
  $('drop').classList.add('has-img');
  $('drop').style.aspectRatio = `${srcW} / ${srcH}`;
  $('srcInfo').textContent = `${srcW} × ${srcH}`;
}

function loadFile(file) {
  if (!file || !file.type.startsWith('image/')) return;
  const url = URL.createObjectURL(file);
  const im = new Image();
  im.onload = () => {
    img = im;
    URL.revokeObjectURL(url);
    renderSource();
    $('paint').disabled = false;
    setStatus('Ready. Press Paint to start from a blank canvas.');
  };
  im.src = url;
}

$('file').addEventListener('change', (e) => loadFile(e.target.files[0]));
const drop = $('drop');
['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add('drag'); }));
['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove('drag'); }));
drop.addEventListener('drop', (e) => loadFile(e.dataTransfer.files[0]));
document.addEventListener('paste', (e) => {
  const item = Array.from(e.clipboardData?.items || []).find(i => i.kind === 'file' && i.type.startsWith('image/'));
  if (!item) return;
  e.preventDefault();
  loadFile(item.getAsFile());
});

// ---- controls ---------------------------------------------------------
$('rounds').addEventListener('input', () => $('roundsVal').textContent = $('rounds').value);
$('detail').addEventListener('input', () => {
  $('detailVal').textContent = DETAIL_NAMES[+$('detail').value - 1];
  renderSource();
});
function refreshSpeed() { $('speedVal').textContent = speedName(+$('speed').value); }
$('speed').addEventListener('input', refreshSpeed);
refreshSpeed();

function setStatus(t) { $('status').textContent = t; }
function setBusy(busy) {
  $('paint').disabled = busy || !img;
  $('rounds').disabled = busy;
  $('detail').disabled = busy;
}

// ---- painting ---------------------------------------------------------
// Preferred: run the WebAssembly painter in a worker (works offline, e.g. in the Android app).
// Fallback: ask the C++ server at /paint (only when the page is served by it).
function computeInWorker(rgb, w, h, rounds, detail) {
  return new Promise((resolve, reject) => {
    const worker = new Worker('painter-worker.js');
    worker.onmessage = (e) => {
      worker.terminate();
      if (e.data.error) reject(new Error(e.data.error));
      else resolve(JSON.parse(e.data.json).strokes);
    };
    worker.onerror = () => { worker.terminate(); reject(new Error('worker unavailable')); };
    worker.postMessage({ rgb, w, h, rounds, detail });
  });
}

async function computeOnServer(rgb, w, h, rounds, detail) {
  const res = await fetch('/paint', {
    method: 'POST',
    headers: { 'X-Width': String(w), 'X-Height': String(h), 'X-Rounds': String(rounds),
               'X-Detail': String(detail), 'Content-Type': 'application/octet-stream' },
    body: rgb,
  });
  if (!res.ok) throw new Error(await res.text());
  return (await res.json()).strokes;
}

async function computeStrokes(rgb, w, h, rounds, detail) {
  try {
    return await computeInWorker(rgb, w, h, rounds, detail);
  } catch (workerError) {
    return await computeOnServer(rgb, w, h, rounds, detail);
  }
}

async function paint() {
  if (!img) return;
  clearTimeout(raf);
  stopRecording();
  playing = false; waiting = false;
  rounds = +$('rounds').value;
  const d = +$('detail').value;
  [outW, outH] = [srcW, srcH];

  // Blank canvas at the image's working size.
  const cv = $('out');
  cv.width = outW; cv.height = outH;
  $('paperBox').style.aspectRatio = `${outW} / ${outH}`;
  out.fillStyle = '#fff';
  out.fillRect(0, 0, outW, outH);
  $('paperBox').classList.add('has-art');
  strokes = []; roundEnd = []; drawn = 0; pos = 0; curRound = 0;
  videoBlob = null;
  $('dlPng').disabled = true;
  $('dlVideo').disabled = true;
  updateProgress();

  const rgba = srcCtx.getImageData(0, 0, outW, outH).data;
  const rgb = new Uint8Array(outW * outH * 3);
  for (let i = 0, j = 0; i < rgba.length; i += 4, j += 3) {
    rgb[j] = rgba[i]; rgb[j + 1] = rgba[i + 1]; rgb[j + 2] = rgba[i + 2];
  }

  setBusy(true);
  $('toggle').disabled = true;
  $('next').hidden = true;
  setStatus('Computing strokes…');
  try {
    strokes = await computeStrokes(rgb, outW, outH, rounds, d);
  } catch (e) {
    setStatus('Something went wrong: ' + e.message);
    setBusy(false);
    return;
  }
  roundEnd = []; let idx = 0;
  for (let r = 0; r < rounds; ++r) {
    while (idx < strokes.length && strokes[idx].round <= r) idx++;
    roundEnd.push(idx);
  }
  setBusy(false);
  $('toggle').disabled = false;
  $('toggle').textContent = 'Pause';
  startRecording();
  playing = true; lastT = performance.now();
  scheduleTick();
}

// ---- optional video recording (in memory only, nothing written unless downloaded)
function startRecording() {
  if (!$('recordVideo').checked || !window.MediaRecorder) return;
  const stream = $('out').captureStream(30);
  const type = ['video/mp4;codecs=avc1', 'video/webm;codecs=vp9', 'video/webm']
    .find(t => MediaRecorder.isTypeSupported(t)) || '';
  const r = new MediaRecorder(stream, type ? { mimeType: type, videoBitsPerSecond: 6000000 } : {});
  const chunks = [];
  rec = r;
  r.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
  r.onstop = () => {
    videoExt = r.mimeType.includes('mp4') ? 'mp4' : 'webm';
    videoBlob = new Blob(chunks, { type: r.mimeType });
    $('dlVideo').disabled = false;
  };
  r.start(500);
}
function stopRecording() {
  if (rec && rec.state !== 'inactive') rec.stop();
  rec = null;
}

// ---- playback ---------------------------------------------------------
function drawStroke(s) {
  const [r, g, b] = s.color;
  out.strokeStyle = `rgb(${r},${g},${b})`;
  out.lineWidth = s.radius * 2;
  out.lineCap = 'round';
  out.lineJoin = 'round';
  out.beginPath();
  out.moveTo(s.pts[0][0], s.pts[0][1]);
  for (let p = 1; p < s.pts.length; ++p) out.lineTo(s.pts[p][0], s.pts[p][1]);
  if (s.pts.length === 1) out.lineTo(s.pts[0][0] + 0.01, s.pts[0][1]);
  out.stroke();
}
function drawUpTo(n) { for (; drawn < n; ++drawn) drawStroke(strokes[drawn]); }

// Timer-based loop (~60 fps); keeps working even when animation frames are throttled.
function scheduleTick() { raf = setTimeout(() => tick(performance.now()), 16); }

function tick(t) {
  const dt = Math.min(0.1, (t - lastT) / 1000);
  lastT = t;
  if (playing && !waiting && strokes.length) {
    pos += dt * speedRate(+$('speed').value);
    const pause = $('pauseEach').checked;
    const limit = pause ? roundEnd[curRound] : strokes.length;
    if (pos >= limit) {
      pos = limit;
      drawUpTo(limit);
      if (pause && curRound < rounds - 1) {
        waiting = true; playing = false;
        $('toggle').disabled = true;
        $('next').hidden = false;
      } else if (limit >= strokes.length) {
        playing = false;
        $('toggle').disabled = true;
      }
    } else {
      drawUpTo(Math.floor(pos));
    }
    updateProgress();
  }
  if (playing || waiting || drawn < strokes.length) scheduleTick();
  else if (strokes.length) finish();
}

function finish() {
  stopRecording();
  setStatus(`Finished · ${rounds} rounds`);
  setBusy(false);
  $('toggle').disabled = true;
  $('next').hidden = true;
  $('dlPng').disabled = false;
  if (!$('recordVideo').checked) $('dlVideo').disabled = true;
  updateProgress();
}

$('toggle').addEventListener('click', () => {
  if (drawn >= strokes.length) return;
  playing = !playing;
  if (playing) { lastT = performance.now(); scheduleTick(); }
  $('toggle').textContent = playing ? 'Pause' : 'Resume';
});
$('next').addEventListener('click', () => {
  curRound++; waiting = false; playing = true;
  $('next').hidden = true;
  $('toggle').disabled = false;
  $('toggle').textContent = 'Pause';
  lastT = performance.now();
  scheduleTick();
});
$('paint').addEventListener('click', paint);

// ---- downloads --------------------------------------------------------
function download(href, name) {
  const a = document.createElement('a');
  a.href = href; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
}
$('dlPng').addEventListener('click', () => download($('out').toDataURL('image/png'), `painting-${rounds}-rounds.png`));
$('dlVideo').addEventListener('click', () => {
  if (!videoBlob) return;
  const url = URL.createObjectURL(videoBlob);
  download(url, `painting-${rounds}-rounds.${videoExt}`);
  setTimeout(() => URL.revokeObjectURL(url), 10000);
});

// ---- progress ---------------------------------------------------------
function updateProgress() {
  const total = strokes.length || 1;
  $('bar').style.width = (100 * drawn / total) + '%';
  const shown = drawn === 0 ? 0 : strokes[drawn - 1].round + 1;
  $('chips').replaceChildren(...Array.from({ length: rounds }, (_, r) => {
    const el = document.createElement('span');
    const now = playing && r === Math.max(0, shown - 1);
    el.className = 'chip' + (now ? ' now' : r < shown ? ' done' : '');
    el.textContent = `Round ${r + 1}`;
    return el;
  }));
  if (playing || waiting) {
    setStatus(waiting ? `Paused after round ${shown} of ${rounds}. Ready for the next round?`
                      : `Painting round ${Math.min(rounds, shown + 1)} of ${rounds}`);
  }
  $('count').textContent = strokes.length ? `${drawn.toLocaleString()} / ${strokes.length.toLocaleString()} strokes` : '';
  $('outInfo').textContent = outW ? `${outW} × ${outH}` : '';
}
</script>
</body>
</html>
